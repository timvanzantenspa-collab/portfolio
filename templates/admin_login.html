<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Project editor | Tim van Zanten</title>
    <style>
        :root { color-scheme: light; --ink: #000; --muted: #555; --paper: #fff; --line: #dedede; --blue: #0101FF; --red: #a23b2e; --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--ink); background: var(--paper); font-family: var(--sans); }
        main { width: min(100%, 430px); padding: 38px; background: #fff; border: 1px solid var(--line); }
        .eyebrow { margin: 0 0 24px; color: var(--blue); font: 700 11px/1.2 var(--sans); letter-spacing: 1.4px; text-transform: uppercase; }
        h1 { margin: 0 0 10px; font: 300 36px/1.15 var(--sans); letter-spacing: 0; }
        p { margin: 0 0 28px; color: var(--muted); font: 15px/1.55 var(--sans); }
        label { display: block; margin-bottom: 8px; font: 700 12px var(--sans); }
        input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 0; font: 15px var(--sans); }
        input:focus { outline: 2px solid var(--blue); outline-offset: 2px; }
        button { width: 100%; min-height: 46px; margin-top: 18px; border: 0; background: var(--blue); color: #fff; font: 700 13px var(--sans); cursor: pointer; }
        .error { margin: 16px 0 0; color: var(--red); font: 13px/1.5 var(--sans); }
        .setup { padding: 12px; background: #f5f6f2; border-left: 3px solid var(--blue); }
    </style>
</head>
<body>
    <main>
        <div class="eyebrow">Tim van Zanten / Portfolio</div>
        <h1>Project editor</h1>
        {% if configured %}
        <form method="post" action="{{ url_for('admin_login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="password">Admin password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            <button type="submit">Sign in</button>
            {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
        </form>
        {% else %}
        <p class="setup">The editor is not enabled yet. Set the <strong>ADMIN_PASSWORD</strong> environment variable for this app.</p>
        {% endif %}
    </main>
</body>
</html>
